<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RM2025</title><style>
:root{color-scheme:dark;--ground:#070d17;--panel:#0c1626;--rule:#1d3150;--ink:#e7eef6;--muted:#9fb0c6;--amber:#f2b53a;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--ground)}*{box-sizing:border-box}body{margin:0}header{height:100px;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}h1{font-size:26px;font-weight:600;margin:0 0 8px}h2{font-size:21px;margin:0 0 24px}h3{font-size:15px;font-weight:600;margin:25px 0 12px}p{margin:0;line-height:1.6}#subtitle,.caption,#gestures{color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:190px minmax(0,1fr) 265px;min-height:calc(100dvh - 100px)}nav{padding:24px 12px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--rule)}button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--rule);padding:10px 12px;cursor:pointer;text-align:left;border-radius:5px}button:hover{border-color:var(--muted)}button[aria-pressed=true]{color:var(--amber);background:#f2b53a12;border-color:#f2b53a60}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:4px}#stage{position:relative;min-height:450px;height:calc(100dvh - 100px);background:var(--panel);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#stage-actions{position:absolute;top:20px;left:20px;display:flex;gap:8px}#stage-actions button{background:#070d17dc}#gestures{position:absolute;bottom:16px;left:20px;pointer-events:none}#loading{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:#070d17c9}#loading[hidden],[hidden]{display:none!important}aside{padding:28px 22px;border-left:1px solid var(--rule);max-height:calc(100dvh - 100px);overflow-y:auto}.value{font-variant-numeric:tabular-nums;font-size:17px;margin:5px 0 18px}a{color:var(--amber);font-size:12px;line-height:1.7;text-decoration:none}a:hover{text-decoration:underline}.references{border-top:1px solid var(--rule);margin-top:26px}.references a{display:block;margin:8px 0}#reference-image{display:block;width:100%;max-height:210px;object-fit:contain;background:#aebcca;border-radius:3px;margin:14px 0 7px}#presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}#presets button{font-size:11px}#sliders{margin-top:20px}label{display:flex;justify-content:space-between;font-size:12px;margin-top:11px}output{font-variant-numeric:tabular-nums;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--amber);margin:8px 0}#pose-status{font-size:12px;margin:14px 0;color:var(--amber)}#pose-status[data-valid=false]{border-left:2px solid var(--amber);padding-left:8px}#insert{width:100%;margin:10px 0}#language{flex-shrink:0}
@media(max-width:1000px){main{grid-template-columns:155px minmax(0,1fr)}aside{grid-column:1/-1;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:0 32px;border-top:1px solid var(--rule)}#pose-panel{grid-column:2;grid-row:1/7}.references{grid-column:1;margin-top:12px}#stage{height:65dvh;min-height:480px}}@media(max-width:600px){header{height:92px;padding:16px}h1{font-size:23px}main{display:flex;flex-direction:column}nav{flex-direction:row;overflow:auto;padding:12px;gap:8px;border-right:0;border-bottom:1px solid var(--rule)}nav button{white-space:nowrap}#stage{height:60dvh;min-height:390px}aside{display:block;padding:22px;max-height:none;border-left:0}.references{margin-top:24px}#stage-actions{left:12px;top:12px}#gestures{left:12px;font-size:11px}}
</style></head><body><script type="module" src="viewer.js"></script></body></html>
